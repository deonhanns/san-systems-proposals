<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A tap-through guide to the Melted Workx event platform, from San Systems.">
<title>Melted Workx Platform Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: a lesson rail beside one working stage. Each lesson is a real screen with numbered dots to tap, the steps to do, and one quick check. */
:root{
  --page:#faf5f4; --surface:#ffffff; --ink:#2a2827; --muted:#6b6462; --line:#e6d6d7;
  --blush:#e9c6c8; --blush-soft:#f6e9ea; --gold:#c7a06b; --gold-ink:#7a5a22; --burgundy:#8a3e45; --on-burgundy:#ffffff;
  --ok:#2f6b3f; --ok-soft:#e7f2e9; --warn:#8a5a00; --warn-soft:#fbf1dc; --rail:#211f1e; --rail-ink:#f3ecea; --rail-muted:#b3a9a6; --shot:#ffffff;
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif; --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --page:#191716; --surface:#242120; --ink:#f1e9e7; --muted:#b0a5a2; --line:#3d3736;
  --blush:#5b3a3d; --blush-soft:#2f2526; --gold:#c7a06b; --gold-ink:#e2c08c; --burgundy:#c9737b; --on-burgundy:#1b1414;
  --ok:#8fd0a0; --ok-soft:#1f3326; --warn:#e7bd6a; --warn-soft:#3a2f17; --rail:#121110; --rail-ink:#f3ecea; --rail-muted:#a39995; --shot:#ffffff; color-scheme:dark } }
:root[data-theme="dark"]{
  --page:#191716; --surface:#242120; --ink:#f1e9e7; --muted:#b0a5a2; --line:#3d3736;
  --blush:#5b3a3d; --blush-soft:#2f2526; --gold:#c7a06b; --gold-ink:#e2c08c; --burgundy:#c9737b; --on-burgundy:#1b1414;
  --ok:#8fd0a0; --ok-soft:#1f3326; --warn:#e7bd6a; --warn-soft:#3a2f17; --rail:#121110; --rail-ink:#f3ecea; --rail-muted:#a39995; --shot:#ffffff; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:18px}
.brand{font-family:var(--display);font-size:27px;font-weight:600;line-height:1.05}
.brand small{display:block;font-family:var(--body);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--rail-muted);font-weight:500;margin-top:6px}
.prog{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--rail-muted)}
.bar{height:6px;background:#3a3533;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--rail-ink);font-size:15px;min-height:44px}
.nav button:hover{background:#2e2a29}
.nav button[aria-current="true"]{background:#3a3332;box-shadow:inset 3px 0 0 var(--gold)}
.tick{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid #6d6562;display:grid;place-items:center;font-size:12px;color:var(--rail)}
.nav button.done .tick{background:var(--gold);border-color:var(--gold)}
.nav button.done .tick::after{content:"✓";font-weight:700}
.stage{padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);font-weight:700}
h1{font-family:var(--display);font-weight:600;font-size:40px;font-size:clamp(34px,5vw,46px);line-height:1.05;margin:4px 0 8px;text-wrap:balance}
.why{font-size:19px;color:var(--muted);max-width:62ch;margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:14.5px;min-height:40px}
.tabs button[aria-selected="true"]{background:var(--burgundy);color:var(--on-burgundy);border-color:var(--burgundy);font-weight:700}
.shot{position:relative;background:var(--shot);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(42,40,39,.10)}
.shot img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:2.5px solid #fff;background:#8a3e45;color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.35);padding:0}
.pin::before{content:"";position:absolute;top:-9px;right:-9px;bottom:-9px;left:-9px;border-radius:50%;border:2px solid #8a3e45;opacity:0;animation:pulse 2.2s infinite}
.pin[aria-pressed="true"]{background:#c7a06b;color:#2a2827;transform:translate(-50%,-50%) scale(1.18)}
.pin[aria-pressed="true"]::before{animation:none}
.pin.seen:not([aria-pressed="true"]){background:#5c5553}
.pin.seen::before{animation:none}
@keyframes pulse{0%{opacity:.7;transform:scale(.7)}70%{opacity:0;transform:scale(1.25)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.pin::before{animation:none}.bar i{transition:none}}
.hint{font-size:14.5px;color:var(--muted);margin:-10px 0 0}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
.spots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.spots button{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 8px}
.spots button:hover{background:var(--blush-soft)}
.spots button[aria-pressed="true"]{background:var(--blush-soft)}
.spots .n{width:28px;height:28px;border-radius:50%;background:var(--burgundy);color:var(--on-burgundy);display:grid;place-items:center;font-weight:700;font-size:14px}
.spots b{display:block}
.spots span.d{display:none;color:var(--muted);font-size:15.5px}
.spots button[aria-pressed="true"] span.d{display:block}
ol.do{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px}
.note{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:15.5px;border:1px solid var(--line)}
.note b{color:var(--warn)}
.quiz p{margin:0 0 10px;font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;border:1px solid var(--line);background:var(--page);border-radius:10px;padding:10px 14px;min-height:44px}
.opts button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.opts button.wrong{background:var(--warn-soft);border-color:var(--warn)}
.fb{margin:10px 0 0;font-size:15.5px}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.btn{border:1px solid var(--burgundy);background:var(--burgundy);color:var(--on-burgundy);border-radius:10px;padding:11px 18px;font-weight:700;min-height:46px}
.btn.ghost{background:none;color:var(--burgundy)}
.sketch{border:2px dashed var(--gold);border-radius:14px;padding:18px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.sketch .tag{align-self:flex-start;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold-ink)}
.sketch .row{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--page)}
.sketch .row i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--blush);display:grid;place-items:center;font-weight:700}
.sketch .row span{color:var(--muted);font-size:15px;display:block}
.chk{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.chk i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--blush);display:grid;place-items:center;font-weight:700}
.chk span{display:block;color:var(--muted);font-size:15.5px}
.yn{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.yn button{border:1px solid var(--line);background:var(--page);border-radius:99px;padding:8px 14px;min-height:44px;font-size:15px}
.yn button.y[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);font-weight:700}
.yn button.n[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);font-weight:700}
.sum{margin:0;white-space:pre-wrap;font-family:var(--body);font-size:15px;background:var(--page);border:1px solid var(--line);border-radius:10px;padding:12px 14px;user-select:all}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.fact b{font-family:var(--display);font-size:25px;font-weight:600;display:block;line-height:1.1;margin-bottom:6px}
dl{margin:0;display:grid;grid-template-columns:minmax(110px,180px) minmax(0,1fr);gap:8px 16px}
dt{font-weight:700}dd{margin:0;color:var(--muted)}
.contact{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.contact .num{font-family:var(--display);font-size:32px;font-weight:600;user-select:all}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .nav button{flex:none;border:1px solid #3a3533;white-space:nowrap}
  .cols{grid-template-columns:minmax(0,1fr)}
  .pin{width:28px;height:28px;font-size:13px}
  dl{grid-template-columns:minmax(0,1fr)} dd{margin-bottom:6px}
}

#gate{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--rail);color:var(--rail-ink);z-index:999;display:flex;align-items:center;justify-content:center}
#gate .box{max-width:340px;width:100%;padding:0 24px;text-align:center}
#gate img{width:210px;max-width:70%;height:auto;margin:0 auto 22px;display:block}
#gate p{color:var(--rail-muted);font-size:15px;margin:0 0 18px}
#gate input{width:100%;background:#2e2a29;border:1px solid #4a4442;border-radius:8px;color:var(--rail-ink);padding:12px;font-size:16px;margin-bottom:12px;font-family:inherit}
#gate button{width:100%;background:var(--gold);color:#2a2827;border:none;border-radius:8px;padding:12px;font-size:16px;font-weight:700;min-height:46px}
#gate .err{color:#f0a3a0;font-size:14px;margin-top:10px;min-height:18px}
html,body{height:100%;margin:0}
</style>

</head>
<body>
<div id="gate"><div class="box">
  <img src="/meltedworkx-001/guide/logo-light.webp" alt="Melted Workx Creative House" onerror="this.style.display='none'">
  <p>This guide is private. Enter the password you use for the progress page.</p>
  <input type="password" id="gate-pw" placeholder="Password" autocomplete="off" aria-label="Password">
  <button id="gate-submit" type="button">Open the guide</button>
  <div class="err" id="gate-err" role="status"></div>
</div></div>
<div class="app">
  <aside class="rail">
    <div class="brand">Melted Workx<small>Platform guide</small></div>
    <div class="prog"><span id="progText">0 of 11 lessons done</span><div class="bar"><i id="progBar"></i></div></div>
    <nav class="nav" id="nav" aria-label="Lessons"></nav>
  </aside>
  <main class="stage"><div class="wrap" id="view"></div></main>
</div>

<script>
const P=(x,y,t,d)=>({x,y,t,d});
const LESSONS=[
{id:"start",name:"Start here",eyebrow:"2 minutes",title:"How this guide works",
 why:"Every lesson shows a real screen from your platform. You tap, you read one line, you move on. No manual to study.",
 intro:true},

{id:"sign-in",name:"Sign in",eyebrow:"Lesson 1",title:"Sign in",
 why:"One web address, your email and your password. It works on a laptop, an iPad or a phone.",
 screens:[{label:"Sign-in page",img:"login",pins:[
  P(49.96,3.5,"The gold strip","This strip means you are in the practice version. Every guest in it is invented and nothing is sent to anyone. The real version has no gold strip."),
  P(86.88,51.14,"Email","Type the login email Deon sent you. Each of you has your own."),
  P(86.88,60.87,"Password","Type your password. Keep it to yourself; never send it by email or in a chat."),
  P(96.4,67.4,"Sign in","Click here. You land on your list of events.")],
  steps:["Open the link Deon sent you, in Chrome or Safari.","Type your email and password.","Click <b>Sign in</b>."]}],
 quiz:{q:"You see a gold strip across the top of the page. What does it tell you?",o:["Something is broken","This is the practice version, so nothing here is real","You are signed out"],a:1,
  why:"Gold strip = practice. Invented guests, and no message leaves the platform."}},

{id:"your-events",name:"Find your event",eyebrow:"Lesson 2",title:"Find your event",
 why:"Each event lives on its own card. Guests from one event never mix with another.",
 screens:[{label:"Your events",img:"events",pins:[
  P(44.5,60.82,"The event card","The event's name, dates and venue. Botswana has its own card."),
  P(22.5,83.72,"Guests","How many guests are in this event right now."),
  P(78.6,83.51,"Open","Click here to go inside the event. This is the button you will use most."),
  P(10.6,31.51,"Your events","From anywhere in the platform, this brings you back to this list.")],
  steps:["Find the card for your event.","Click the burgundy <b>Open</b> button on the card."]}],
 quiz:{q:"How do you get inside the Botswana event?",o:["Click the Open button on its card","Click New event","Type the event name in the browser"],a:0,
  why:"Open takes you in. New event is only for creating a different event."}},

{id:"morning-check",name:"The morning check",eyebrow:"Lesson 3",title:"The morning check",
 why:"One page replaces the sheets and the chats. Thirty seconds here tells you where the event stands.",
 screens:[{label:"The four numbers",img:"overview-top",pins:[
  P(12,50,"The menu","Everything about this event: Guests, Import, Messages, Check-in and Crew. Overview is this page."),
  P(24.1,56.86,"Guests","Everyone in the event."),
  P(40.91,56.86,"Check-ins","How many check-ins have been recorded across all the days."),
  P(57.73,56.86,"Messages sent","Messages that went out to guests."),
  P(74.55,56.86,"Failed messages","In red because a person needs to look. Lesson 8 shows what to do.")],
  steps:["Open your event. You land on <b>Overview</b>.","Read the four numbers from left to right.","If the red number is not zero, scroll down to <b>Needs attention</b>."]},
 {label:"The detail below",img:"overview-low",pins:[
  P(49.36,23.72,"Check-in, day by day","Arrivals on 30 November, then 1, 2 and 3 December. Each row shows how many guests are checked in for that day."),
  P(41.5,57.85,"Who can be messaged","Only guests who ticked the agreement box can be messaged. Guests who said no, or were never asked, are blocked automatically."),
  P(14,66.2,"Messages","Waiting, sent, failed, and blocked because the guest has not agreed."),
  P(19,88.1,"Needs attention","Your to-do list, in plain words: messages that failed and rows in a file that need a human look.")],
  steps:["Scroll down the Overview page.","Check <b>Needs attention</b> last. If it is empty, you are done."]}],
 quiz:{q:"A guest did not tick the agreement box on the form. Can the platform message them?",o:["Yes, if you choose WhatsApp","No. They are blocked automatically","Only on the day"],a:1,
  why:"No agreement, no message. The platform enforces it so nobody has to remember."}},

{id:"guest-list",name:"Your guest list",eyebrow:"Lesson 4",title:"Your guest list",
 why:"Every guest in one list, with their contact details and whether they agreed to be messaged.",
 screens:[{label:"Guests",img:"guests",pins:[
  P(26,6.18,"How many","The total for this event."),
  P(27.5,19.41,"A guest's name","Click a name to open that guest. That is where you correct a flight, a pick-up time or a hotel for one person."),
  P(81.6,29.9,"Green: agreed","This guest ticked the box, so they can be messaged."),
  P(81.6,46.08,"Grey or red","Grey means the guest was never asked. Red means they said no. Neither will be messaged."),
  P(83.2,7.94,"Import guest list","Adds guests from a file. The next lesson walks through it."),
  P(66,13.4,"Export CSV","Downloads the list as a spreadsheet file.")],
  steps:["Click <b>Guests</b> in the menu.","Click a guest's name to see or correct their details."]}],
 note:"<b>These labels are being simplified.</b> The words in the last column will soon read \"Can be messaged\", \"Not asked yet\" and \"Said no\".",
 quiz:{q:"One guest's flight changed. Where do you fix it?",o:["Upload the whole guest list again","Open Guests and click that guest's name","Phone Deon"],a:1,
  why:"One guest, one click on their name. No need to re-upload anything."}},

{id:"add-guests",name:"Bring in a guest list",eyebrow:"Lesson 5",title:"Bring in a guest list",
 why:"Your Google Form answers go in as a file. The platform reads it, shows you what it found, and saves nothing until you say so.",
 screens:[{label:"1. Upload",img:"import",pins:[
  P(43,79.83,"Choose file","Pick the file from your computer. It must be a CSV file."),
  P(24.5,89.32,"Upload and check the list","The platform reads the file and shows you a preview. Nothing is saved yet."),
  P(19.5,41.53,"Shuttle list","A different job, for pick-up times. It has its own lesson.")],
  steps:["In Google Sheets: <b>File, Download, Comma-separated values (.csv)</b>.","In the platform, click <b>Import</b> in the menu.","Click <b>Choose file</b>, pick the CSV, then <b>Upload and check the list</b>."]},
 {label:"2. Match the columns",img:"import-match",pins:[
  P(11.67,33.75,"Your form's questions","Each line is one question from your Google Form."),
  P(60,33.75,"What the platform thinks it is","It guesses: email, name, dietary, language. Change a guess with the drop-down if it is wrong."),
  P(85,54.75,"How names are written","Tells the platform that the last word is the surname."),
  P(18,96.75,"Update preview","Click after changing a drop-down to see the result.")],
  steps:["Read down the list. Most guesses will be right.","Fix any that are wrong, then click <b>Update preview</b>."]},
 {label:"3. Check the list",img:"import-check",pins:[
  P(14.5,38.95,"Warning","A row the platform is unsure about."),
  P(79,38.95,"The reason","Written out in plain words. Here the same email appears twice in the file."),
  P(14.5,61.58,"Ok","Nothing to do for these rows.")],
  steps:["Scroll the list and read any warnings.","At the bottom, read the summary line, then click the button to add the guests."]},
 {label:"4. The result",img:"import-result",pins:[
  P(24,13.4,"Created","New guests added to the event."),
  P(30,30.4,"Held back","Rows that look like someone already in the event. The platform does not create them twice."),
  P(16,43.2,"View the guest list","Go and see the new guests."),
  P(25,55.2,"Who was held back","The names, so you can check them.")],
  steps:["Read the result. Every row in your file is accounted for.","For the <b>international</b> form, record consent using the tick-box column when the page asks.","For the <b>local</b> form, skip the consent step. Local guests are not messaged."]}],
 note:"<b>Good to know.</b> Once a file has been added it cannot be added again or undone, so read step 3 before you confirm.",
 quiz:{q:"Your guest list is an Excel file (.xlsx). Will it upload?",o:["Yes, any spreadsheet works","No. Save or download it as a CSV first","Only on a laptop"],a:1,
  why:"CSV only. In Google Sheets it is File, Download, Comma-separated values."}},

{id:"shuttle-list",name:"Upload the shuttle list",eyebrow:"Lesson 6",title:"Upload the shuttle list",
 why:"One row per guest with their pick-up time. After that, each guest's message fills in their own time. Nobody types a name.",
 screens:[{label:"The steps",sketch:[
  ["Import, then \"Upload the shuttle list\"","The link sits at the top of the Import page."],
  ["Choose your CSV file","One row per guest: name, flight, pick-up date and time, hotel."],
  ["Say which column is which","Guest name, reservation number, flight, pick-up date and time, hotel. Choose day / month / year for dates."],
  ["Read the preview","Each row is marked Matched, Not matched, or More than one guest with this name."],
  ["Confirm shuttle list","Nothing changes until you click this."]],
  steps:["Add each guest's email or WhatsApp number to the sheet if you can. Matching is more reliable than names alone.","Upload again whenever flights change. You can do it as often as you like.","Guests who were not matched show up under <b>Needs attention</b> on the Overview."]}],
 note:"<b>Safe to repeat.</b> An empty cell never wipes what is already saved. Times written like 13h00 are fine.",
 quiz:{q:"You upload the list again and one guest's pick-up time is empty this time. What happens to the time already saved?",o:["It is deleted","It stays as it was","The guest is removed"],a:1,
  why:"A blank cell never wipes an existing value."}},

{id:"send-message",name:"Send a message",eyebrow:"Lesson 7",title:"Send a message",
 why:"Pick the message, pick who gets it, look at the preview, confirm. The platform does the rest.",
 screens:[{label:"1. Messages",img:"messaging",pins:[
  P(70.5,30,"Send to guests","Start here to send. You always see a preview first."),
  P(94.5,30,"Outbox","What happened to every message: sent, delivered, failed or blocked."),
  P(46.6,30,"Templates","The wording of each message. Deon looks after these.")],
  steps:["Click <b>Messages</b> in the menu.","Click <b>Send to guests</b>."]},
 {label:"2. Choose and confirm",sketch:[
  ["Choose what to send","Pick the message, for example the shuttle departure notice."],
  ["How sent","WhatsApp or SMS."],
  ["Who gets it","One guest (search by name), the guests with a certain pick-up date, or everyone."],
  ["Preview","Read the message exactly as the guest will see it."],
  ["Confirm and queue","The message joins the queue to be sent."]],
  steps:["Choose the message and how it is sent.","Choose who gets it.","Read the preview, then click <b>Confirm and queue</b>."]},
 {label:"3. See what happened",img:"results",pins:[
  P(26.05,20.33,"The totals","How many messages, and how many failed."),

const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},h="")=>{const e=document.createElement(t);for(const k in a)e.setAttribute(k,a[k]);e.innerHTML=h;return e};
let done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem("mw-guide-done")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("mw-guide-done",JSON.stringify([...done]))}catch(e){}};
const countable=LESSONS.filter(l=>!l.intro);
let cur=0,scr=0,active=-1;

function drawNav(){
  const nav=$("#nav");nav.innerHTML="";
  LESSONS.forEach((l,i)=>{
    const b=el("button",{type:"button","aria-current":i===cur?"true":"false"},`<span class="tick"></span><span>${l.name}</span>`);
    if(done.has(l.id))b.classList.add("done");
    b.onclick=()=>go(i);nav.appendChild(b);
  });
  const n=countable.filter(l=>done.has(l.id)).length;
  $("#progText").textContent=`${n} of ${countable.length} lessons done`;
  $("#progBar").style.width=(n/countable.length*100)+"%";
  const c=nav.children[cur];if(c&&nav.scrollWidth>nav.clientWidth)nav.scrollLeft=c.offsetLeft-60;
}
function go(i,keepHash){cur=Math.max(0,Math.min(LESSONS.length-1,i));scr=0;active=-1;
  if(!keepHash){try{history.replaceState(null,"","#"+LESSONS[cur].id)}catch(e){location.hash=LESSONS[cur].id}}
  draw();window.scrollTo(0,0)}
function draw(){drawNav();const l=LESSONS[cur],v=$("#view");v.innerHTML="";
  v.appendChild(el("header",{},`<div class="eyebrow">${l.eyebrow}</div><h1>${l.title}</h1><p class="why">${l.why}</p>`));
  if(l.intro)return drawIntro(v);
  if(l.help)return drawHelp(v,l);
  if(l.check)return drawCheck(v,l);
  if(l.screens.length>1){const t=el("div",{class:"tabs",role:"tablist"});
    l.screens.forEach((s,i)=>{const b=el("button",{type:"button",role:"tab","aria-selected":i===scr?"true":"false"},s.label);b.onclick=()=>{scr=i;active=-1;draw()};t.appendChild(b)});v.appendChild(t)}
  const s=l.screens[scr];
  if(s.img){const f=el("div",{class:"shot"});f.appendChild(el("img",{src:`/meltedworkx-001/guide/img/${s.img}.webp`,alt:`Screenshot: ${s.label}`}));
    s.pins.forEach((p,i)=>{const b=el("button",{type:"button",class:"pin","aria-pressed":"false","aria-label":`${i+1}: ${p.t}`,style:`left:${p.x}%;top:${p.y}%`},String(i+1));b.onclick=()=>pick(i);f.appendChild(b)});
    v.appendChild(f);v.appendChild(el("p",{class:"hint"},"Tap a numbered dot on the picture, or a line in the list below."));
  }else{const k=el("div",{class:"sketch"},`<span class="tag">Steps in order. Picture of this screen to follow</span>`+s.sketch.map((r,i)=>`<div class="row"><i>${i+1}</i><div><b>${r[0]}</b><span>${r[1]}</span></div></div>`).join(""));v.appendChild(k)}
  const cols=el("div",{class:"cols"});
  if(s.img){const c=el("section",{class:"card"},`<h2>What you are looking at</h2>`);const ul=el("ul",{class:"spots"});
    s.pins.forEach((p,i)=>{const li=el("li");const b=el("button",{type:"button","aria-pressed":"false"},`<span class="n">${i+1}</span><span><b>${p.t}</b><span class="d">${p.d}</span></span>`);b.onclick=()=>pick(i);li.appendChild(b);ul.appendChild(li)});
    c.appendChild(ul);cols.appendChild(c)}
  const d=el("section",{class:"card"},`<h2>Do this</h2><ol class="do">${s.steps.map(x=>`<li>${x}</li>`).join("")}</ol>`);cols.appendChild(d);
  if(!s.img)cols.style.gridTemplateColumns="minmax(0,1fr)";
  v.appendChild(cols);
  const last=scr===l.screens.length-1;
  if(last&&l.note)v.appendChild(el("div",{class:"note"},l.note));
  if(last&&l.quiz){const q=el("section",{class:"card quiz"},`<h2>Quick check</h2><p>${l.quiz.q}</p>`);const o=el("div",{class:"opts"});
    const fb=el("p",{class:"fb",role:"status"});
    l.quiz.o.forEach((t,i)=>{const b=el("button",{type:"button"},t);b.onclick=()=>{[...o.children].forEach(x=>x.classList.remove("right","wrong"));
      if(i===l.quiz.a){b.classList.add("right");fb.innerHTML="<b>Right.</b> "+l.quiz.why;done.add(l.id);save();drawNav()}else{b.classList.add("wrong");fb.innerHTML="<b>Not quite.</b> Have another go."}};o.appendChild(b)});
    q.appendChild(o);q.appendChild(fb);v.appendChild(q)}
  const f=el("div",{class:"foot"});
  const back=el("button",{type:"button",class:"btn ghost"},"Back");back.onclick=()=>{if(scr>0){scr--;active=-1;draw();window.scrollTo(0,0)}else go(cur-1)};
  const next=el("button",{type:"button",class:"btn"},last?(cur<LESSONS.length-1?"Next lesson: "+LESSONS[cur+1].name:"Finish"):"Next: "+l.screens[scr+1].label);
  next.onclick=()=>{if(!last){scr++;active=-1;draw();window.scrollTo(0,0)}else{done.add(l.id);save();go(cur+1)}};
  f.appendChild(back);f.appendChild(next);v.appendChild(f);
  if(s.img)pick(0,true);
}
function pick(i,quiet){active=i;
  document.querySelectorAll(".pin").forEach((b,j)=>{b.setAttribute("aria-pressed",j===i?"true":"false");if(j===i&&!quiet)b.classList.add("seen")});
  document.querySelectorAll(".spots button").forEach((b,j)=>b.setAttribute("aria-pressed",j===i?"true":"false"));
}

  v.appendChild(el("div",{class:"grid3"},[
   ["Tap the dots","Each numbered dot on a picture explains one thing on the screen."],

  v.appendChild(el("div",{class:"note"},"<b>You cannot break anything.</b> The practice version has invented guests only, and no message leaves the platform. The pictures come from the practice version, and a few screens are still being polished, so yours may look slightly neater."));

}

  const c=el("section",{class:"card"},`<h2>Who to contact</h2><div class="contact"><span class="num" id="num">+27 73 302 0683</span><button type="button" class="btn ghost" id="copy">Copy number</button></div><p style="margin:8px 0 0;color:var(--muted)">Deon Hanns, San Systems. Normal business hours, South African time. For 30 November to 3 December someone is on standby from 07:00 to 20:00 each day, and Deon will send their name and number before the event.</p>`);

    function sel(){const r=document.createRange();r.selectNodeContents($("#num"));const s=getSelection();s.removeAllRanges();s.addRange(r)}};
  v.appendChild(el("section",{class:"card"},`<h2>If something looks wrong</h2><ol class="do"><li>Take a screenshot of the whole page.</li><li>Note what you clicked just before.</li><li>Send both to Deon. Never send a password.</li></ol>`));

   <dt>Crew</dt><dd>Door staff who only get the check-in desk.</dd></dl>`));
  const f=el("div",{class:"foot"});const back=el("button",{type:"button",class:"btn ghost"},"Back");back.onclick=()=>go(cur-1);
  const fin=el("button",{type:"button",class:"btn"},done.has(l.id)?"Marked as read":"Mark as read");fin.onclick=()=>{done.add(l.id);save();draw()};
  f.appendChild(back);f.appendChild(fin);v.appendChild(f);
}
function drawCheck(v,l){
  let st={};try{st=JSON.parse(localStorage.getItem("mw-guide-ipad")||"{}")}catch(e){}
  v.appendChild(el("div",{class:"note"},"<b>Practice version only.</b> Use the invented guests. If a step does not work, that is a result, not a mistake: mark it, take a screenshot of the iPad, and carry on if you can."));
  const list=el("section",{class:"card"},`<h2>Do each step, then mark it</h2>`);const out=el("pre",{class:"sum",id:"sum"});
  const summary=()=>{const lines=l.check.map((c,i)=>`${i+1}. ${c[0]}: ${st[i]==="y"?"worked":st[i]==="n"?"DID NOT WORK":"not done yet"}`);out.textContent="iPad offline test\n"+lines.join("\n");
    if(l.check.every((c,i)=>st[i])){done.add(l.id);save();drawNav()}};
  l.check.forEach((c,i)=>{const r=el("div",{class:"chk"},`<i>${i+1}</i><div><b>${c[0]}</b><span>${c[1]}</span><div class="yn"></div></div>`);
    const yn=$(".yn",r);[["y","It worked"],["n","It did not work"]].forEach(([k,t])=>{const b=el("button",{type:"button","aria-pressed":st[i]===k?"true":"false",class:k},t);
      b.onclick=()=>{st[i]=st[i]===k?undefined:k;try{localStorage.setItem("mw-guide-ipad",JSON.stringify(st))}catch(e){}[...yn.children].forEach(x=>x.setAttribute("aria-pressed","false"));if(st[i])b.setAttribute("aria-pressed","true");summary()};yn.appendChild(b)});
    list.appendChild(r)});
  v.appendChild(list);

  const cp=el("button",{type:"button",class:"btn ghost",style:"margin-top:12px"},"Copy result");
  cp.onclick=()=>{const ok=()=>{cp.textContent="Copied";setTimeout(()=>cp.textContent="Copy result",1800)};const sel=()=>{const r=document.createRange();r.selectNodeContents(out);const g=getSelection();g.removeAllRanges();g.addRange(r)};
    try{navigator.clipboard.writeText(out.textContent).then(ok,sel)}catch(e){sel()}};
  s.appendChild(cp);v.appendChild(s);summary();
  const f=el("div",{class:"foot"});const back=el("button",{type:"button",class:"btn ghost"},"Back");back.onclick=()=>go(cur-1);

}
function fromHash(){const id=(location.hash||"").slice(1);const i=LESSONS.findIndex(l=>l.id===id);go(i<0?0:i,true)}
window.addEventListener("hashchange",fromHash);fromHash();

<script>
(function(){
  // Same password as the progress page. No plaintext password in source; checked against a SHA-256 hash.
  var HASH='6ddf588c919716323114588753c67d83baf3799996e8235cfbd4dd012d4f40d1';
  var g=document.getElementById('gate'),a=document.querySelector('.app');
  function open(){g.style.display='none';a.style.display=''}
  a.style.display='none';
  var ok=false;try{ok=sessionStorage.getItem('mw-progress-unlocked')==='1'}catch(e){}
  if(ok)open();
  function hex(t){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return('0'+x.toString(16)).slice(-2)}).join('')})}
  document.getElementById('gate-submit').addEventListener('click',function(){
    hex(document.getElementById('gate-pw').value).then(function(h){
      if(h===HASH){try{sessionStorage.setItem('mw-progress-unlocked','1')}catch(e){}open()}
      else document.getElementById('gate-err').textContent='Incorrect password'})});
  document.getElementById('gate-pw').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('gate-submit').click()});
})();
</script>
