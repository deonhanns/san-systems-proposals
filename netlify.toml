[build]
  publish = "."

# ── Security Headers ──

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# OG image — cache forever (immutable, content-hashable)
[[headers]]
  for = "/og-sansystems.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML proposal files — never cache (instant updates on redeploy)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Proposal subdirectory index files
[[headers]]
  for = "/[!.]*/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Pretty URLs ──
# /aspiral-001 serves aspiral-001/index.html

[[redirects]]
  from = "/*/"
  to = "/:splat/index.html"
  status = 200

# Root serves index.html
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
